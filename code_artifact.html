<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>発表順ランダム選出ルーレット</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: M PLUS Rounded 1c & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'M PLUS Rounded 1c', 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
      min-height: 100vh;
      color: #f8fafc;
    }

    /* 光彩アニメーション */
    .glow-box {
      box-shadow: 0 0 40px rgba(168, 85, 247, 0.35), inset 0 0 20px rgba(236, 72, 153, 0.2);
    }
    .glow-gold {
      box-shadow: 0 0 35px rgba(250, 204, 21, 0.45);
    }

    /* ルーレットの文字切り替え用 */
    @keyframes pulseScale {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
    .anim-pulse-scale {
      animation: pulseScale 0.22s ease-in-out infinite;
    }

    @keyframes bounceIn {
      0% { transform: scale(0.3); opacity: 0; }
      50% { transform: scale(1.15); opacity: 1; }
      70% { transform: scale(0.95); }
      100% { transform: scale(1); }
    }
    .anim-winner {
      animation: bounceIn 0.65s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    /* キラキラ回転背景 */
    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .spin-slow {
      animation: spinSlow 20s linear infinite;
    }

    @keyframes shimmerRing {
      0% { transform: scale(0.96); opacity: 0.25; }
      50% { transform: scale(1.02); opacity: 0.9; }
      100% { transform: scale(0.96); opacity: 0.25; }
    }
    @keyframes winnerBeam {
      0% { transform: scaleX(0.5); opacity: 0; }
      30% { transform: scaleX(1); opacity: 0.9; }
      100% { transform: scaleX(1.1); opacity: 0.15; }
    }
    @keyframes winnerPulse {
      0%, 100% { transform: scale(1); text-shadow: 0 0 0 rgba(250, 204, 21, 0); }
      25% { transform: scale(1.03); text-shadow: 0 0 18px rgba(250, 204, 21, 0.9); }
      50% { transform: scale(1.08); text-shadow: 0 0 32px rgba(244, 114, 182, 0.9); }
      75% { transform: scale(1.04); text-shadow: 0 0 18px rgba(250, 204, 21, 0.8); }
    }

    .stage-halo {
      animation: shimmerRing 2.6s ease-in-out infinite;
      background: radial-gradient(circle, rgba(217, 70, 239, 0.2), rgba(99, 102, 241, 0.12) 35%, rgba(15, 23, 42, 0) 70%);
    }
    .winner-beam {
      animation: winnerBeam 1.1s ease-out forwards;
      background: linear-gradient(90deg, transparent, rgba(250, 204, 21, 0.8), rgba(236, 72, 153, 0.8), transparent);
    }
    .winner-pulse {
      animation: winnerPulse 0.85s ease-in-out infinite alternate;
    }

    /* 紙吹雪用キャンバス */
    #confettiCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 50;
    }
  </style>
</head>
<body class="relative flex flex-col items-center justify-start p-4 sm:p-6 md:p-8 min-h-screen selection:bg-fuchsia-500 selection:text-white">
  <!-- パーティクル・紙吹雪キャンバス -->
  <canvas id="confettiCanvas"></canvas>

  <!-- 背景デコレーション -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none -z-10">
    <div class="absolute -top-32 -left-32 w-96 h-96 bg-purple-600/20 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-pink-600/20 rounded-full blur-3xl"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-indigo-600/10 rounded-full blur-3xl"></div>
  </div>

  <!-- ヘッダー -->
  <header class="w-full max-w-3xl text-center mb-6">
    <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-white/10 backdrop-blur-md border border-white/15 text-xs sm:text-sm text-pink-300 font-semibold mb-3 tracking-wide">
      <span>✨</span> ランダム発表者セレクター
    </div>
    <h1 class="text-3xl sm:text-4xl md:text-5xl font-extrabold tracking-tight bg-gradient-to-r from-amber-300 via-pink-400 to-indigo-300 bg-clip-text text-transparent pb-1">
      本日のプレゼンター選出！
    </h1>
    <p class="text-sm sm:text-base text-slate-300 mt-2">
      ボタンを押すと、臨場感あふれるルーレットで次回の発表者を1人ずつ決定します。
    </p>
  </header>

  <!-- メインコンテナ -->
  <main class="w-full max-w-3xl flex flex-col gap-6">

    <!-- ルーレットステージカード -->
    <div class="relative bg-slate-900/70 border border-slate-700/60 backdrop-blur-xl rounded-3xl p-6 sm:p-8 glow-box overflow-hidden text-center">
      
      <!-- ステータスバッジ（上部） -->
      <div class="flex items-center justify-between gap-2 mb-4">
        <div class="flex items-center gap-2">
          <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
          <span id="turnCounter" class="text-xs sm:text-sm font-bold text-slate-300">第 1 発表者を選出準備中</span>
        </div>
        <div class="text-xs font-semibold px-3 py-1 rounded-full bg-slate-800 text-slate-300 border border-slate-700">
          残り候補者: <span id="remainingBadge" class="text-pink-400 font-bold">5</span> / 5名
        </div>
      </div>

      <!-- ルーレットメイン画面 -->
      <div class="relative h-44 sm:h-52 w-full flex items-center justify-center rounded-2xl bg-gradient-to-b from-slate-950/80 to-slate-900/90 border border-purple-500/30 overflow-hidden shadow-inner my-2">
        <!-- 背景の集中線/サークル風演出 -->
        <div id="radialEffect" class="absolute inset-0 opacity-15 spin-slow flex items-center justify-center transition-opacity duration-500">
          <div class="w-96 h-96 rounded-full border-4 border-dashed border-pink-400"></div>
        </div>
        <div id="stageHalo" class="stage-halo absolute inset-4 rounded-[2rem] opacity-0 transition-opacity duration-500 pointer-events-none"></div>
        <div id="winnerBeam" class="winner-beam absolute inset-x-12 top-8 h-24 rounded-full opacity-0 pointer-events-none"></div>

        <!-- 決定時のスポットライト効果 -->
        <div id="spotlightEffect" class="absolute inset-0 bg-gradient-to-t from-pink-500/20 via-transparent to-purple-500/20 opacity-0 transition-opacity duration-300 pointer-events-none"></div>

        <!-- 表示テキストエリア -->
        <div class="relative z-10 px-4 flex flex-col items-center justify-center">
          <div id="orderLabel" class="text-xs sm:text-sm tracking-widest text-amber-300 font-bold uppercase mb-1 opacity-0 transition-opacity">
            🎉 NEXT SPEAKER 🎉
          </div>
          <div id="displayName" class="text-3xl sm:text-5xl md:text-6xl font-black tracking-wider text-slate-100 transition-all duration-150 drop-shadow-md">
            準備完了！
          </div>
          <p id="subHint" class="text-xs sm:text-sm text-slate-400 mt-2">
            下の「選出する」ボタンをクリックしてください
          </p>
        </div>
      </div>

      <!-- 操作アクションボタン -->
      <div class="mt-6 flex flex-col sm:flex-row items-center justify-center gap-4">
        <!-- 選出ボタン -->
        <button id="drawBtn" class="w-full sm:w-auto min-w-[240px] px-8 py-4 rounded-2xl font-black text-lg sm:text-xl text-white bg-gradient-to-r from-pink-500 via-rose-500 to-amber-500 hover:from-pink-400 hover:to-amber-400 active:scale-95 shadow-lg shadow-pink-500/30 transition-all duration-200 flex items-center justify-center gap-3 cursor-pointer group">
          <span class="group-hover:rotate-12 transition-transform duration-200">🎯</span>
          <span id="btnText">選出する！</span>
        </button>

        <!-- サブ操作：サウンド切替 ＆ リセット -->
        <div class="flex items-center gap-2">
          <button id="soundToggleBtn" class="px-4 py-3.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 text-sm font-semibold flex items-center gap-2 transition cursor-pointer" title="サウンドON/OFF">
            <span id="soundIcon">🔊</span>
            <span id="soundStatusText" class="hidden sm:inline">音声 ON</span>
          </button>
          <button id="resetBtn" class="px-4 py-3.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 text-sm font-semibold flex items-center gap-2 transition cursor-pointer" title="最初からやり直す">
            <span>🔄</span>
            <span class="hidden sm:inline">リセット</span>
          </button>
        </div>
      </div>

    </div>

    <!-- 下部エリア：候補者一覧 ＆ 決定済み発表順 -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

      <!-- 候補者一覧カード -->
      <div class="bg-slate-900/60 border border-slate-800 backdrop-blur-md rounded-2xl p-5 shadow-lg">
        <div class="flex items-center justify-between mb-3 border-b border-slate-800 pb-2">
          <h2 class="text-base sm:text-lg font-bold flex items-center gap-2 text-slate-200">
            <span>👥</span> 候補者リスト (<span id="candidateCount">5</span>名)
          </h2>
          <button id="editCandidatesBtn" class="text-xs text-indigo-400 hover:text-indigo-300 underline cursor-pointer">
            名前を編集
          </button>
        </div>
        <ul id="candidateList" class="space-y-2">
          <!-- JSで動的生成 -->
        </ul>
      </div>

      <!-- 発表順序タイムラインカード -->
      <div class="bg-slate-900/60 border border-slate-800 backdrop-blur-md rounded-2xl p-5 shadow-lg">
        <div class="flex items-center justify-between mb-3 border-b border-slate-800 pb-2">
          <h2 class="text-base sm:text-lg font-bold flex items-center gap-2 text-slate-200">
            <span>📋</span> 決定した発表順
          </h2>
          <span id="historyCountBadge" class="text-xs bg-slate-800 text-slate-400 px-2.5 py-0.5 rounded-full border border-slate-700">0 / 5名 決定</span>
        </div>
        <div id="historyEmpty" class="text-center py-8 text-slate-500 text-sm">
          まだ選出されていません<br>「選出する」ボタンを押してください
        </div>
        <ol id="historyList" class="space-y-2 hidden">
          <!-- JSで動的生成 -->
        </ol>
      </div>

    </div>

  </main>

  <!-- 候補者編集モーダル（ポップアップ） -->
  <div id="editModal" class="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4 hidden">
    <div class="bg-slate-900 border border-slate-700 rounded-3xl p-6 w-full max-w-md shadow-2xl">
      <h3 class="text-xl font-bold text-white mb-2 flex items-center gap-2">
        <span>✏️</span> 候補者の編集
      </h3>
      <p class="text-xs text-slate-400 mb-4">
        1行に1人ずつ名前を入力してください（空行は除外されます）。
      </p>
      <textarea id="editCandidatesInput" rows="6" class="w-full rounded-xl bg-slate-950 border border-slate-700 p-3 text-sm text-slate-100 focus:outline-none focus:border-pink-500 focus:ring-1 focus:ring-pink-500 font-sans leading-relaxed"></textarea>
      <div class="flex justify-end gap-3 mt-4">
        <button id="closeModalBtn" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-semibold transition cursor-pointer">
          キャンセル
        </button>
        <button id="saveCandidatesBtn" class="px-5 py-2 rounded-xl bg-gradient-to-r from-pink-500 to-indigo-600 hover:from-pink-400 hover:to-indigo-500 text-white text-sm font-bold shadow-md transition cursor-pointer">
          更新してリセット
        </button>
      </div>
    </div>
  </div>

  <script>
    // デフォルトの日本姓名5名
    const DEFAULT_CANDIDATES = [
      "佐藤 健太郎",
      "鈴木 結衣",
      "高橋 翔太",
      "田中 美咲",
      "渡辺 大輝"
    ];

    // アプリ状態
    let allCandidates = [...DEFAULT_CANDIDATES];
    let remainingCandidates = [...DEFAULT_CANDIDATES];
    let chosenList = [];
    let isSpinning = false;
    let soundEnabled = true;

    // DOM要素参照
    const displayName = document.getElementById('displayName');
    const orderLabel = document.getElementById('orderLabel');
    const subHint = document.getElementById('subHint');
    const drawBtn = document.getElementById('drawBtn');
    const btnText = document.getElementById('btnText');
    const turnCounter = document.getElementById('turnCounter');
    const remainingBadge = document.getElementById('remainingBadge');
    const radialEffect = document.getElementById('radialEffect');
    const stageHalo = document.getElementById('stageHalo');
    const winnerBeam = document.getElementById('winnerBeam');
    const spotlightEffect = document.getElementById('spotlightEffect');
    const candidateList = document.getElementById('candidateList');
    const candidateCount = document.getElementById('candidateCount');
    const historyList = document.getElementById('historyList');
    const historyEmpty = document.getElementById('historyEmpty');
    const historyCountBadge = document.getElementById('historyCountBadge');
    const resetBtn = document.getElementById('resetBtn');
    const soundToggleBtn = document.getElementById('soundToggleBtn');
    const soundIcon = document.getElementById('soundIcon');
    const soundStatusText = document.getElementById('soundStatusText');
    const editCandidatesBtn = document.getElementById('editCandidatesBtn');
    const editModal = document.getElementById('editModal');
    const editCandidatesInput = document.getElementById('editCandidatesInput');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const saveCandidatesBtn = document.getElementById('saveCandidatesBtn');

    // Web Audio API による自作シンセ（外部リソース不要で確実に再生可能）
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    // カチカチ（ルーレット回転音）
    function playTickSound() {
      if (!soundEnabled) return;
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(450 + Math.random() * 150, ctx.currentTime);
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.04);
      } catch (e) {
        console.error(e);
      }
    }

    // ファンファーレ／決定音
    function playFanfareSound() {
      if (!soundEnabled) return;
      try {
        const ctx = getAudioContext();
        const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.08);
          gain.gain.setValueAtTime(0.18, ctx.currentTime + idx * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.08 + 0.4);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + idx * 0.08);
          osc.stop(ctx.currentTime + idx * 0.08 + 0.45);
        });
      } catch (e) {
        console.error(e);
      }
    }

    function playFinaleSound() {
      if (!soundEnabled) return;
      try {
        const ctx = getAudioContext();
        const base = ctx.createOscillator();
        const baseGain = ctx.createGain();
        const sparkle = ctx.createOscillator();
        const sparkleGain = ctx.createGain();

        base.type = 'sawtooth';
        base.frequency.setValueAtTime(110, ctx.currentTime);
        base.frequency.exponentialRampToValueAtTime(220, ctx.currentTime + 0.35);
        baseGain.gain.setValueAtTime(0.16, ctx.currentTime);
        baseGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);

        sparkle.type = 'triangle';
        sparkle.frequency.setValueAtTime(440, ctx.currentTime + 0.08);
        sparkle.frequency.exponentialRampToValueAtTime(660, ctx.currentTime + 0.45);
        sparkleGain.gain.setValueAtTime(0.12, ctx.currentTime + 0.08);
        sparkleGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.52);

        base.connect(baseGain).connect(ctx.destination);
        sparkle.connect(sparkleGain).connect(ctx.destination);

        base.start();
        sparkle.start(ctx.currentTime + 0.08);
        base.stop(ctx.currentTime + 0.8);
        sparkle.stop(ctx.currentTime + 0.52);
      } catch (e) {
        console.error(e);
      }
    }

    // 紙吹雪システム
    const confettiCanvas = document.getElementById('confettiCanvas');
    const confettiCtx = confettiCanvas.getContext('2d');
    let particles = [];
    let confettiAnimationId = null;

    function resizeCanvas() {
      confettiCanvas.width = window.innerWidth;
      confettiCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function createConfettiBurst(count = 90) {
      const colors = ['#f43f5e', '#ec4899', '#d946ef', '#a855f7', '#6366f1', '#eab308', '#22c55e', '#38bdf8'];
      const cx = window.innerWidth / 2;
      const cy = window.innerHeight * 0.45;
      
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const velocity = 8 + Math.random() * 14;
        particles.push({
          x: cx,
          y: cy,
          vx: Math.cos(angle) * velocity,
          vy: Math.sin(angle) * velocity - 3,
          size: 6 + Math.random() * 6,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          rotationSpeed: (Math.random() - 0.5) * 12,
          gravity: 0.35 + Math.random() * 0.15,
          opacity: 1,
          decay: 0.008 + Math.random() * 0.008,
          wobble: Math.random() * 10
        });
      }

      if (!confettiAnimationId) {
        animateConfetti();
      }
    }

    function animateConfetti() {
      confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity;
        p.rotation += p.rotationSpeed;
        p.opacity -= p.decay;

        if (p.opacity <= 0 || p.y > confettiCanvas.height) {
          particles.splice(i, 1);
          continue;
        }

        confettiCtx.save();
        confettiCtx.translate(p.x, p.y);
        confettiCtx.rotate((p.rotation * Math.PI) / 180);
        confettiCtx.globalAlpha = Math.max(0, p.opacity);
        confettiCtx.fillStyle = p.color;
        confettiCtx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
        confettiCtx.restore();
      }

      if (particles.length > 0) {
        confettiAnimationId = requestAnimationFrame(animateConfetti);
      } else {
        confettiAnimationId = null;
        confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      }
    }

    // UIの描画更新
    function updateUI() {
      candidateCount.textContent = allCandidates.length;
      remainingBadge.textContent = remainingCandidates.length;

      const nextTurnNum = chosenList.length + 1;
      if (remainingCandidates.length > 0) {
        turnCounter.textContent = `第 ${nextTurnNum} 発表者を選出準備中`;
        btnText.textContent = `第 ${nextTurnNum} 発表者を選出！`;
        drawBtn.disabled = false;
        drawBtn.classList.remove('opacity-50', 'cursor-not-allowed');
      } else {
        turnCounter.textContent = '🎉 全員の発表順が確定しました！';
        btnText.textContent = '選出完了';
        drawBtn.disabled = true;
        drawBtn.classList.add('opacity-50', 'cursor-not-allowed');
      }

      // 候補者リストの描画
      candidateList.innerHTML = '';
      allCandidates.forEach(name => {
        const isChosen = chosenList.some(item => item.name === name);
        const li = document.createElement('li');
        li.className = `flex items-center justify-between p-2.5 rounded-xl border text-sm transition-all duration-300 ${
          isChosen
            ? 'bg-slate-950/40 border-slate-800/80 text-slate-500 line-through'
            : 'bg-slate-800/60 border-slate-700/60 text-slate-200 hover:border-pink-500/50'
        }`;
        
        li.innerHTML = `
          <span class="flex items-center gap-2">
            <span class="text-xs px-2 py-0.5 rounded-md ${isChosen ? 'bg-slate-800 text-slate-500' : 'bg-pink-500/20 text-pink-300 border border-pink-500/30'}">
              ${isChosen ? '済' : '待機中'}
            </span>
            <span class="font-bold">${name}</span>
          </span>
          ${isChosen ? '<span class="text-xs text-slate-500">選出済</span>' : '<span class="text-xs text-pink-400">候補</span>'}
        `;
        candidateList.appendChild(li);
      });

      // 発表順履歴の描画
      historyCountBadge.textContent = `${chosenList.length} / ${allCandidates.length}名 決定`;
      if (chosenList.length === 0) {
        historyEmpty.classList.remove('hidden');
        historyList.classList.add('hidden');
      } else {
        historyEmpty.classList.add('hidden');
        historyList.classList.remove('hidden');
        historyList.innerHTML = '';

        chosenList.forEach((item, index) => {
          const li = document.createElement('li');
          const isLatest = index === chosenList.length - 1;
          const medals = ['🥇', '🥈', '🥉', '✨', '🌟'];
          const medal = medals[index] || '🎯';

          li.className = `flex items-center justify-between p-3 rounded-xl border transition-all duration-500 ${
            isLatest
              ? 'bg-gradient-to-r from-pink-900/40 to-purple-900/40 border-pink-500/60 shadow-lg glow-gold text-white scale-[1.02]'
              : 'bg-slate-800/40 border-slate-700/40 text-slate-200'
          }`;

          li.innerHTML = `
            <div class="flex items-center gap-3">
              <span class="w-7 h-7 flex items-center justify-center rounded-lg bg-slate-800 text-base font-black shadow">
                ${medal}
              </span>
              <div>
                <span class="text-xs font-semibold text-pink-400 block">第 ${item.order} 発表者</span>
                <span class="font-black text-base sm:text-lg tracking-wide">${item.name}</span>
              </div>
            </div>
            <span class="text-xs text-slate-400 font-mono">${item.time}</span>
          `;
          historyList.appendChild(li);
        });
      }
    }

    // ルーレット選出ロジック
    function startRoulette() {
      if (isSpinning || remainingCandidates.length === 0) return;
      isSpinning = true;
      drawBtn.disabled = true;

      // 演出リセット
      displayName.classList.remove('anim-winner', 'text-amber-300', 'winner-pulse');
      displayName.classList.add('anim-pulse-scale', 'text-pink-300');
      radialEffect.classList.remove('opacity-15');
      radialEffect.classList.add('opacity-40');
      stageHalo.classList.remove('opacity-100');
      stageHalo.classList.add('opacity-0');
      winnerBeam.classList.remove('opacity-100');
      winnerBeam.classList.add('opacity-0');
      spotlightEffect.classList.add('opacity-0');
      orderLabel.classList.add('opacity-0');
      subHint.textContent = '抽選中... ドラムロール！🥁';

      const nextOrder = chosenList.length + 1;
      const targetIndex = Math.floor(Math.random() * remainingCandidates.length);
      const selectedPerson = remainingCandidates[targetIndex];

      // アニメーション設定
      const totalDuration = 2200; // 2.2秒
      const startTime = performance.now();
      let lastTickTime = 0;
      let currentInterval = 40; // 初期高速切り替え間隔 (ms)

      function step(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / totalDuration, 1);

        // イージング（徐々に間隔を広げる）
        currentInterval = 35 + Math.pow(progress, 2.5) * 320;

        if (currentTime - lastTickTime >= currentInterval) {
          lastTickTime = currentTime;
          // ランダムに名前をフラッシュ表示
          const randomDisplay = allCandidates[Math.floor(Math.random() * allCandidates.length)];
          displayName.textContent = randomDisplay;
          playTickSound();
        }

        if (progress < 1) {
          requestAnimationFrame(step);
        } else {
          // 決定完了！
          finishSelection(selectedPerson, nextOrder);
        }
      }

      requestAnimationFrame(step);
    }

    function finishSelection(winner, order) {
      // 候補者から削除し、決定リストへ
      const idx = remainingCandidates.indexOf(winner);
      if (idx !== -1) {
        remainingCandidates.splice(idx, 1);
      }

      const now = new Date();
      const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
      chosenList.push({
        name: winner,
        order: order,
        time: timeStr
      });

      // 表示の確定＆演出
      displayName.classList.remove('anim-pulse-scale', 'text-pink-300');
      displayName.classList.add('anim-winner', 'text-amber-300', 'winner-pulse');
      displayName.textContent = winner;

      orderLabel.textContent = `🎉 第 ${order} 発表者に決定！ 🎉`;
      orderLabel.classList.remove('opacity-0');
      subHint.textContent = `拍手をお願いします！👏`;

      radialEffect.classList.remove('opacity-40');
      radialEffect.classList.add('opacity-15');
      stageHalo.classList.remove('opacity-0');
      stageHalo.classList.add('opacity-100');
      winnerBeam.classList.remove('opacity-0');
      winnerBeam.classList.add('opacity-100');
      spotlightEffect.classList.remove('opacity-0');

      // 効果音＆紙吹雪
      playFanfareSound();
      playFinaleSound();
      createConfettiBurst(remainingCandidates.length === 0 ? 150 : 80);

      isSpinning = false;
      updateUI();
    }

    // リセット機能
    function resetAll() {
      if (isSpinning) return;
      remainingCandidates = [...allCandidates];
      chosenList = [];
      displayName.className = 'text-3xl sm:text-5xl md:text-6xl font-black tracking-wider text-slate-100 transition-all duration-150 drop-shadow-md';
      displayName.textContent = '準備完了！';
      orderLabel.classList.add('opacity-0');
      stageHalo.classList.remove('opacity-100');
      stageHalo.classList.add('opacity-0');
      winnerBeam.classList.remove('opacity-100');
      winnerBeam.classList.add('opacity-0');
      spotlightEffect.classList.add('opacity-0');
      subHint.textContent = '下の「選出する」ボタンをクリックしてください';
      updateUI();
    }

    // サウンド切替
    soundToggleBtn.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      if (soundEnabled) {
        soundIcon.textContent = '🔊';
        soundStatusText.textContent = '音声 ON';
        getAudioContext(); // ユーザー操作でAudioContext初期化
      } else {
        soundIcon.textContent = '🔇';
        soundStatusText.textContent = '音声 OFF';
      }
    });

    // モーダル操作（候補者編集）
    editCandidatesBtn.addEventListener('click', () => {
      editCandidatesInput.value = allCandidates.join('\n');
      editModal.classList.remove('hidden');
    });

    closeModalBtn.addEventListener('click', () => {
      editModal.classList.add('hidden');
    });

    saveCandidatesBtn.addEventListener('click', () => {
      const rawText = editCandidatesInput.value;
      const lines = rawText
        .split('\n')
        .map(s => s.trim())
        .filter(s => s.length > 0);

      if (lines.length === 0) {
        return; // 空の場合は無視
      }

      allCandidates = lines;
      editModal.classList.add('hidden');
      resetAll();
    });

    // クリック＆キーボードショートカット
    drawBtn.addEventListener('click', startRoulette);
    resetBtn.addEventListener('click', resetAll);

    // スペースキーでも選出できるようにサポート
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && !editModal.classList.contains('hidden') === false) {
        if (!isSpinning && remainingCandidates.length > 0 && document.activeElement.tagName !== 'TEXTAREA') {
          e.preventDefault();
          startRoulette();
        }
      }
    });

    // 初回レンダリング
    updateUI();
  </script>
</body>
</html>
